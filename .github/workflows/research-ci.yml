name: Research regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-spatial-qc-sources.mjs
      - run: node scripts/spatial-qc.mjs --check
      - run: node scripts/validate-segmentation-source.mjs --check
      - run: npm run check
      - run: npm run build
      # The exact lockfile Playwright runner downloads its matching browser in CI.
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:public
      - run: npm run test:e2e -- --config tests/e2e/public-result-page.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            output/e2e-results
            output/e2e-report
            output/e2e-public-results
            output/e2e-public-report
          if-no-files-found: ignore
